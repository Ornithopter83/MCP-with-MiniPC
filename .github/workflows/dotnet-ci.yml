name: .NET CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Show .NET environment
        run: dotnet --info

      - name: Validate managed Web extension JavaScript
        run: |
          node --check extension/gptweb-hub/content.js
          node --check extension/gptweb-hub/background.js

      - name: Restore
        run: dotnet restore ProjectHub.sln

      - name: Build
        run: dotnet build ProjectHub.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ProjectHub.sln --configuration Release --no-build --verbosity normal
